name: 지면 전체 수집

# 네이버 신문보기에서 9개 언론사 당일 지면 기사를 전부 수집해 artifact로 보관한다.
# 단독·기획 선별, 요약, archive.json 반영은 Claude 예약 작업(매일 09:00 KST)이 담당한다.
# 기사 본문이 들어 있으므로 레포에는 커밋하지 않고 artifact로만 2일 보관한다.

on:
  schedule:
    # 매일 07:50 KST (GitHub cron은 UTC 기준, 실제 실행은 몇 분~수십 분 늦을 수 있음)
    - cron: '50 22 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '수집할 지면 날짜 (YYYY-MM-DD, 비우면 오늘 KST)'
        required: false

permissions:
  contents: read

concurrency:
  group: daily-newspaper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 날짜 결정
        id: day
        run: |
          d="${{ inputs.date }}"
          if [ -z "$d" ]; then d=$(TZ=Asia/Seoul date +%F); fi
          echo "date=$d" >> "$GITHUB_OUTPUT"

      - name: 네이버 신문보기 전체 수집
        run: node scripts/scrape-naver.mjs "${{ steps.day.outputs.date }}" out

      - name: artifact 보관
        uses: actions/upload-artifact@v4
        with:
          name: newspaper-${{ steps.day.outputs.date }}
          path: out/
          retention-days: 2
          overwrite: true
