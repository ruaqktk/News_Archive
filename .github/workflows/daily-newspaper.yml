name: 단독·기획 지면 수집

on:
  schedule:
    # 매일 08:40 KST (GitHub cron은 UTC 기준, 실제 실행은 몇 분~수십 분 늦을 수 있음)
    - cron: '40 23 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '수집할 지면 날짜 (YYYY-MM-DD, 비우면 오늘 KST)'
        required: false

permissions:
  contents: write

concurrency:
  group: daily-newspaper
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 네이버 신문보기 수집
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/collect-naver.mjs "${{ inputs.date }}" > run.json

      - name: 수집 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-json
          path: run.json
          if-no-files-found: ignore

      - name: 아카이브 병합 및 검증
        run: |
          node scripts/merge-run.mjs run.json
          npm run check
          npm test
          npm run build

      - name: 커밋
        run: |
          git config user.name "news-archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/archive.json
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "Archive $(node -p "require('./run.json').date") newspaper exclusives and features"
          git pull --rebase origin main
          git push origin HEAD:main
