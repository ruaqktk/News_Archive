<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f1f3f6" />
    <meta name="description" content="12개 신문의 오늘자 지면에 실린 단독·기획 기사를 날짜별, 언론사별로 모아 보는 아카이브입니다." />
    <title>혜원이의 뉴스 아카이브</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="./assets/styles.css" />
    <script type="module" src="./assets/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#editions">기사 목록으로 건너뛰기</a>

    <header class="topbar">
      <div class="topbar-inner">
        <a class="site-name" href="./">혜원이의 뉴스 아카이브</a>

        <nav class="date-nav" aria-label="지면 날짜">
          <button type="button" class="icon-button" id="date-prev" aria-label="이전 날짜">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
          </button>
          <div class="date-picker">
            <button type="button" class="date-button" id="date-button" aria-haspopup="listbox" aria-expanded="false" aria-controls="date-list">
              <span id="date-label">불러오는 중</span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
            </button>
            <ul class="date-list" id="date-list" role="listbox" aria-label="아카이브 날짜" hidden></ul>
          </div>
          <button type="button" class="icon-button" id="date-next" aria-label="다음 날짜">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
          </button>
        </nav>

        <label class="press-select">
          <span class="sr-only">언론사 선택</span>
          <select id="press-select"><option value="all">전체 언론사</option></select>
        </label>
      </div>
    </header>

    <main class="page">
      <div class="edition-bar">
        <p class="edition-count" id="edition-count" aria-live="polite"></p>
        <div class="filters">
        <label class="section-select">
          <span class="sr-only">분야 선택</span>
          <select id="section-select"><option value="all">전체 분야</option></select>
        </label>
        <div class="type-filter" role="group" aria-label="기사 종류">
          <button type="button" data-type="all" aria-pressed="true">전체</button>
          <button type="button" data-type="exclusive" aria-pressed="false">단독</button>
          <button type="button" data-type="feature" aria-pressed="false">기획</button>
        </div>
        </div>
      </div>

      <div id="load-error" class="notice" role="alert" hidden>
        아카이브 데이터를 불러오지 못했습니다. 네트워크 연결을 확인한 뒤 새로고침해 주세요.
      </div>

      <section id="editions" class="press-grid" aria-label="언론사별 기사" aria-busy="true"></section>

      <section id="quiet-press" class="quiet-press" hidden aria-labelledby="quiet-title">
        <h2 id="quiet-title">이 날 단독·기획 기사가 없는 언론사</h2>
        <ul id="quiet-list"></ul>
      </section>

      <details class="coverage" id="coverage" hidden>
        <summary>수집 현황</summary>
        <p id="coverage-note"></p>
        <ul id="coverage-list"></ul>
      </details>
    </main>

    <noscript><p class="notice">기사 목록을 보려면 JavaScript를 켜 주세요.</p></noscript>
  </body>
</html>
